[project]
name = "mlops-aiops-pipeline"
version = "0.1.0"
description = "MLOps + AIOps pipeline on AWS SageMaker over Calgary 311 data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-dateutil>=2.9",
    "holidays>=0.53",
]

[project.optional-dependencies]
ml = [
    "sagemaker>=2.220",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "matplotlib>=3.9",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "cairosvg>=2.7",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py312"
# Code samples inside article drafts are formatted for prose, not by ruff.
extend-exclude = ["stages", "docs", "notebooks", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
